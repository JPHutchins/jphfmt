name: warm-caches

on:
  schedule:
    # Weekly, Monday, off the :00 mark: GitHub evicts a cache entry seven days after its last
    # access, so one restore a week keeps the entry alive with a day's margin.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Serializes runs: a restore refreshes the cache's access time either way, so two at once buy
# nothing. Queues rather than cancels.
concurrency: warm-caches

permissions:
  contents: read

jobs:
  # The same two cache-restoring steps ci.yaml runs, and nothing else: a restore is the access
  # that resets the eviction clock, and on a key miss (a changed lockfile since the last hit)
  # each action re-saves under the new key from the prefix it restored — so the next real CI run
  # starts from the closest available content instead of cold.
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

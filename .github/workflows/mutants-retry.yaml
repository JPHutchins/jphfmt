# The fresh-runner retry for the mutation sweep: a cancelled or failed `mutants` run means the
# sweep never produced a valid report — a runner shutdown mid-Test is the recorded instance
# (#136) — and no step added to the cancelled job can run inside it. This workflow re-runs the
# sweep for the same SHA on a new runner, the same pattern `review.yaml` uses to consume CI.

name: mutants-retry

on:
  workflow_run:
    workflows: ["mutants"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  # A cancelled conclusion is the preemption signature; a failure conclusion is the report
  # step's loud exit (no outcomes.json, or not well-formed). Both mean the same thing: the
  # sweep has no valid report. A build failure re-fails in seconds on the retry, so re-running
  # it is the cheap case. A successful run already wrote its report.
  check:
    if: >-
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run download "${{ github.event.workflow_run.id }}" -n mutants-out -D /tmp/mutants-out \
            >/dev/null 2>&1
          downloaded=$?
          set -e
          if [ "$downloaded" -eq 0 ] && jq -e . /tmp/mutants-out/outcomes.json >/dev/null 2>&1; then
            echo "the interrupted run left a valid outcomes.json — nothing to re-run"
            echo "needed=false" >>"$GITHUB_OUTPUT"
          else
            echo "needed=true" >>"$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.needed == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mutants-run.yaml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

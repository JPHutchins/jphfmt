name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Only the `release` job writes to the repository; everything else reads.
permissions:
  contents: read

jobs:
  # Validation on every push/PR. camas is the single source of truth: bare `camas` runs its
  # `github_task` (defined in tasks.py's Config — the workflow never names tasks), from inside the
  # Nix dev shell that provides node, uv, nix, and the extension's node_modules (built hermetically
  # from package-lock.json by importNpmLock — no npm ci). That task is the full parallel validation:
  # the Rust checks are crane-backed `nix run` apps (fmt, clippy -D warnings, test on stable + MSRV,
  # doc, RUSTSEC audit); plus prettier, eslint, tsc, knip, typos, and nixfmt.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop --command camas

  # Build release binaries on every push/PR to catch breakage early.
  # Uploaded as CI artifacts (raw binary); promoted to the release page only on v* tags.
  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # ARM Linux is musl, not glibc, and its linker lives in `.cargo/config.toml` so the same
          # `cargo build --target` works off CI. `aarch64-unknown-linux-gnu` is absent deliberately:
          # glibc cannot be linked self-contained, so it would need a cross toolchain to buy nothing
          # a static musl binary does not already give.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - id: bin
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-pc-windows-*) echo "name=jphfmt.exe" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=jphfmt" >> "$GITHUB_OUTPUT" ;;
          esac

      # Proves the binary is the architecture it claims, not merely that it linked. Skipped for the
      # two targets this runner cannot execute; `file` covers the ARM Linux one.
      - if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }} --version

      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: file target/${{ matrix.target }}/release/jphfmt | grep -q 'ARM aarch64.*statically linked'

      - uses: actions/upload-artifact@v4
        with:
          name: jphfmt-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }}

  crate:
    needs: [binaries, validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish

  # One package per marketplace platform target, each bundling that platform's binary, plus a
  # universal one with none. VS Code installs the platform match and falls back to universal, so a
  # platform with no build of its own keeps the old behavior (`jphfmt` on PATH) rather than seeing
  # no extension at all. Runs on pull requests too: packaging is the part that breaks silently.
  extension:
    needs: [binaries, validate]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `linux-x64` takes the *musl* build rather than gnu. A bundled binary has to run on
          # whatever distro the user has, and a glibc build inherits the runner image's glibc
          # floor — static musl has none.
          - { vsce: linux-x64, target: x86_64-unknown-linux-musl }
          - { vsce: alpine-x64, target: x86_64-unknown-linux-musl }
          - { vsce: linux-arm64, target: aarch64-unknown-linux-musl }
          - { vsce: alpine-arm64, target: aarch64-unknown-linux-musl }
          - { vsce: darwin-x64, target: x86_64-apple-darwin }
          - { vsce: darwin-arm64, target: aarch64-apple-darwin }
          - { vsce: win32-x64, target: x86_64-pc-windows-msvc }
          - { vsce: win32-arm64, target: aarch64-pc-windows-msvc }
          - { vsce: universal }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - if: matrix.target != ''
        uses: actions/download-artifact@v4
        with:
          name: jphfmt-${{ matrix.target }}
          path: editors/vscode/bin

      # The mode may not survive the artifact round-trip, and a binary that is not executable fails
      # at spawn on the user's machine, where nothing here would catch it.
      - if: matrix.target != ''
        run: chmod +x editors/vscode/bin/*

      - run: npm ci
        working-directory: editors/vscode
      - run: npm run build
        working-directory: editors/vscode

      - id: pkg
        working-directory: editors/vscode
        shell: bash
        run: |
          if [ "${{ matrix.vsce }}" = universal ]; then
            npx --yes @vscode/vsce package
          else
            npx --yes @vscode/vsce package --target "${{ matrix.vsce }}"
          fi
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      # Proves the binary is in the package and where the extension looks for it.
      - if: matrix.target != ''
        working-directory: editors/vscode
        shell: bash
        run: |
          unzip -l "${{ steps.pkg.outputs.vsix }}" | grep -qE 'extension/bin/jphfmt(\.exe)?$'

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce }}
          path: editors/vscode/${{ steps.pkg.outputs.vsix }}

      # `--packagePath` publishes the package that was just built and verified, rather than building
      # a second one; the target is read back from its manifest.
      - env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' && startsWith(github.ref, 'refs/tags/v') }}
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce publish --packagePath "${{ steps.pkg.outputs.vsix }}"

  # The only job that writes to the repository, and the only one gated on the tag alone.
  release:
    needs: [binaries, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jphfmt-*
          path: binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: packages
      - shell: bash
        run: |
          mkdir assets
          for binary in binaries/jphfmt-*/jphfmt*; do
            dir="${binary%/*}"
            name="${binary##*/}"
            cp "$binary" "assets/jphfmt-${dir##*/jphfmt-}${name#jphfmt}"
          done
          cp packages/*/*.vsix assets/
          ls -l assets
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*

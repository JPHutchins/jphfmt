name: mutants

on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:

# Serializes runs: the rolling issue is found by a query, so two runs at once could both miss it
# and both create one. Queues rather than cancels.
concurrency: mutation-testing-report

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      prior: ${{ steps.list.outputs.prior }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One cell per src file — the crate's mutation targets — except builders.rs, which splits
          # into four of cargo-mutants' own --shard slices so a reaped runner costs a quarter (#65).
          # The plan itself is mutants_report.py's plan mode.
          matrix=$(find src -name '*.rs' | sort | uv run .github/workflows/mutants_report.py plan)
          jq -e 'length > 0' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          prior=$(gh run list --workflow mutants --limit 100 \
            --json databaseId,headSha,status,conclusion \
            --jq 'map(select(.headSha == "${{ github.sha }}" and .status == "completed")) | .[].databaseId') \
            || { echo "::warning::the prior-run query failed; no resume this run" >&2; true; }
          { echo "prior<<EOF"; echo "$prior"; echo "EOF"; } >>"$GITHUB_OUTPUT"
          outside=$(find . -path ./target -prune -o -name '*.rs' -print | grep -v '^./src/' || true)
          if [ -n "$outside" ]; then
            echo "::warning::.rs files outside src/ are not sharded and are not mutated:"
            # shellcheck disable=SC2001
            echo "$outside" | sed 's/^/  /' >&2
          fi

  # One shard per cell of the plan: a runner shutdown costs the shard it killed, not the whole
  # sweep — the 51-minute monolith that died in #136 becomes many minutes-long cells, each with its own
  # outcomes artifact. A shard whose outcomes already exist from a prior run of this SHA skips —
  # the resume: a re-dispatch after a shutdown re-runs only the shards that died. The check runs
  # before the toolchain installs, so a skipped shard pays nothing.
  shard:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          while read -r prior; do
            mkdir -p prior
            [ -n "$prior" ] || continue
            if gh run download "$prior" -n "mutants-out-${{ matrix.index }}" -D prior \
                >/dev/null 2>&1 \
              && { [ -f prior/complete ] || [ -f prior/mutants.out/complete ]; }; then
              echo "shard already analyzed in run $prior — skipping"
              skip=true
              break
            fi
            rm -rf prior
          done < <(echo "${{ needs.plan.outputs.prior }}")
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prior.outputs.skip != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.prior.outputs.skip != 'true'
        with:
          # Pinned alongside the parser: an unpinned tool is a silent report-format migration.
          tool: cargo-mutants@27.1.0
      - uses: astral-sh/setup-uv@v6
        if: steps.prior.outputs.skip != 'true'
      - id: sweep
        if: steps.prior.outputs.skip != 'true'
        continue-on-error: true
        env:
          FILE: ${{ matrix.file }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          args=()
          [ -n "$SHARD" ] && args=(--shard "$SHARD")
          # Bounded test timeout: 4x the baseline test time instead of cargo-mutants' 5x
          # auto-set. The builders shard's cursor-arithmetic hang class is fixed at the source
          # (builders.rs advances are saturating_add, which cargo-mutants cannot invert), so
          # the bound is defense in depth for any hang that remains — and 4x keeps ~2x CPU
          # headroom under --jobs 8 contention, where 3x misclassifies slow-but-finite mutants.
          cargo mutants --jobs 8 --timeout-multiplier 4 --file "$FILE" "${args[@]}" 2>&1 | tee mutants.sweep.log || true
          if uv run .github/workflows/mutants_report.py sweep-marked mutants.out mutants.sweep.log; then
            cp mutants.sweep.log mutants.out/sweep.log
            touch mutants.out/complete
          fi
      - if: steps.prior.outputs.skip != 'true' && hashFiles('mutants.out/complete') != ''
        uses: actions/upload-artifact@v7
        with:
          # A "Re-run all jobs" re-executes this shard in the same run, where artifact names are
          # immutable without this; same-SHA same-file outcomes are identical content either way.
          overwrite: true
          # The whole directory: outcomes.json plus each survivor's log and diff, which the
          # report's footer points readers at. The artifact holds outcomes.json and the logs one
          # level deep under mutants.out/, while the complete marker extracts flat — the readers
          # use each path the dispatches verified.
          name: mutants-out-${{ matrix.index }}
          path: mutants.out/*

  report:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Download the current run's shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix || '[]' }}
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' 2>/dev/null || echo "__ARTIFACTS_API_FAILED__")
          for idx in $(jq -r '.[].index' <<<"$MATRIX" 2>/dev/null || true); do
            mkdir -p "merged/mutants-out-$idx"
            if ! gh run download "$GITHUB_RUN_ID" -n "mutants-out-$idx" -D "merged/mutants-out-$idx" \
                >/dev/null 2>&1 \
              && ! gh run download "$GITHUB_RUN_ID" -n "mutants-out-$idx" -D "merged/mutants-out-$idx" \
                >/dev/null 2>&1; then
              if [ "$names" = "__ARTIFACTS_API_FAILED__" ]; then
                echo "::error::artifacts API failed for mutants-out-$idx"
              elif echo "$names" | grep -qx "mutants-out-$idx"; then
                echo "::error::download failed for mutants-out-$idx though the artifact exists"
              else
                rm -rf "merged/mutants-out-$idx"
              fi
            fi
          done
      - name: Download the prior runs' shards, newest first
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix || '[]' }}
        run: |
          for idx in $(jq -r '.[].index' <<<"$MATRIX" 2>/dev/null || true); do
            if uv run .github/workflows/mutants_report.py sweep-marked \
                "merged/mutants-out-$idx/mutants.out" \
                "merged/mutants-out-$idx/mutants.out/sweep.log" \
                >/dev/null 2>&1 \
              || uv run .github/workflows/mutants_report.py sweep-marked \
                "merged/mutants-out-$idx" \
                "merged/mutants-out-$idx/sweep.log" \
                >/dev/null 2>&1; then
              continue
            fi
            mkdir -p "prior-$idx"
            while read -r prior; do
              [ -n "$prior" ] || continue
              gh run download "$prior" -n "mutants-out-$idx" -D "prior-$idx" \
                >/dev/null 2>&1 \
                || gh run download "$prior" -n "mutants-out-$idx" -D "prior-$idx" \
                  >/dev/null 2>&1 \
                || true
              { [ -f "prior-$idx/complete" ] || [ -f "prior-$idx/mutants.out/complete" ]; } && break
              rm -rf "prior-$idx"
            done < <(echo "${{ needs.plan.outputs.prior }}")
            if ! { [ -f "prior-$idx/complete" ] || [ -f "prior-$idx/mutants.out/complete" ]; }; then
              rm -rf "prior-$idx"
            fi
          done
      - id: merge
        name: Merge the shards' outcomes
        env:
          MATRIX: ${{ needs.plan.outputs.matrix || '[]' }}
        run: |
          uv run .github/workflows/mutants_report.py merge "$MATRIX" \
            merged prior merged/outcomes.json merged/missing.txt merged/empty.txt >>"$GITHUB_OUTPUT"
      - id: report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix || '[]' }}
        run: |
          if [ -f merged/empty.txt ]; then
            if [ "${{ needs.plan.result }}" != "success" ]; then
              # An empty matrix reaches the merge only when the plan job failed — its jq gate
              # hard-fails first — so this diagnosis names the cause instead of blaming a plan
              # that ran.
              echo "The plan job failed; its logs carry the cause." > mutants-report.md
              echo "title=Mutation sweep did not run" >>"$GITHUB_OUTPUT"
            else
              {
                cat merged/empty.txt
                if [ -s merged/missing.txt ]; then
                  echo
                  echo '```'
                  cat merged/missing.txt
                  echo '```'
                  if [ "${{ steps.merge.outputs.resumable }}" = "true" ]; then
                    echo "A re-dispatch resumes the shards that died."
                  else
                    echo "The merge rejected them, and a re-dispatch re-rejects the same files."
                  fi
                fi
              } > mutants-report.md
              echo "title=${{ steps.merge.outputs.title }}" >>"$GITHUB_OUTPUT"
            fi
            echo "missed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          uv run .github/workflows/mutants_report.py report merged/outcomes.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            mutants-report.md "$MATRIX" >>"$GITHUB_OUTPUT"
          # A partial merge must never read as clean: the issue body names the shards that left
          # no outcomes, and the missed-count gate below cannot suppress an update on it.
          # The append is outside the report's BODY_LIMIT fit; its worst case — the header plus
          # 20 names plus the ellipsis line — stays under the ~5.5K slack to GitHub's 65536 cap.
          if [ -s merged/missing.txt ]; then
            {
              echo
              echo "**Shards with no outcomes** — a runner shutdown or a build failure took them;"
              if [ "${{ steps.merge.outputs.resumable }}" = "true" ]; then
                echo "a re-dispatch resumes exactly these:"
              else
                echo "the merge rejected them, and a re-dispatch re-rejects the same files:"
              fi
              echo '```'
              head -n 20 merged/missing.txt
              [ -n "$(sed -n '21p' merged/missing.txt)" ] && echo "... and more"
              echo '```'
            } >> mutants-report.md
          fi
      - id: rolling
        if: success() && (steps.report.outputs.missed != '0' || steps.report.outputs.timedout != '0' || steps.merge.outputs.missing == 'true' || steps.merge.outputs.ran != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label mutation-testing --state open --limit 1 \
            --json number --jq '.[0].number // ""')
          echo "number=$number" >>"$GITHUB_OUTPUT"
      - if: success() && (steps.report.outputs.missed != '0' || steps.report.outputs.timedout != '0' || steps.merge.outputs.missing == 'true' || steps.merge.outputs.ran != 'true')
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.rolling.outputs.number }}
          title: ${{ steps.report.outputs.title }}${{ steps.merge.outputs.partial == 'true' && ' (partial shards)' || '' }}
          content-filepath: mutants-report.md
          labels: 'mutation-testing'
      - name: Retire the rolling issue on a complete clean sweep
        if: success() && steps.report.outputs.missed == '0' && steps.report.outputs.timedout == '0' && steps.merge.outputs.missing != 'true' && steps.merge.outputs.ran == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label mutation-testing --state open --limit 20 \
            --json number --jq '.[].number' | while read -r number; do
            gh issue close "$number" --reason completed
          done

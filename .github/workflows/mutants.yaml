name: mutants

on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:

# Serializes runs: the rolling issue is found by a query, so two runs at once could both miss it
# and both create one. Queues rather than cancels.
concurrency: mutation-testing-report

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          files=$(find src -name '*.rs' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >>"$GITHUB_OUTPUT"

  # One shard per source file: a runner shutdown costs the shard it killed, not the whole sweep —
  # the 51-minute monolith that died in #136 becomes many minutes-long cells, each with its own
  # outcomes artifact (one flat outcomes.json per artifact). A shard whose outcomes already exist
  # from a prior completed run of this SHA skips — the resume: a re-dispatch after a shutdown
  # re-runs only the shards that died. The check runs before the toolchain installs, so a skipped
  # shard pays nothing.
  shard:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v7
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow mutants --json databaseId,headSha,status \
            --jq 'map(select(.headSha == "${{ github.sha }}" and .databaseId != "${{ github.run_id }}" and .status == "completed")) | .[0].databaseId // ""' 2>/dev/null)
          skip=false
          if [ -n "$prior" ]; then
            mkdir -p prior
            if gh run download "$prior" -n "mutants-out-${{ strategy.job-index }}" -D prior \
                >/dev/null 2>&1 \
              && jq -e . prior/outcomes.json >/dev/null 2>&1; then
              echo "shard already analyzed in run $prior — skipping"
              skip=true
            fi
          fi
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prior.outputs.skip != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.prior.outputs.skip != 'true'
        with:
          tool: cargo-mutants
      - id: sweep
        if: steps.prior.outputs.skip != 'true'
        continue-on-error: true
        run: cargo mutants --file "${{ matrix.file }}" --output mutants.out
      - if: steps.prior.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out/outcomes.json

  report:
    needs: shard
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Merge the prior run's shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow mutants --json databaseId,headSha,status \
            --jq 'map(select(.headSha == "${{ github.sha }}" and .status == "completed")) | .[0].databaseId // ""' 2>/dev/null)
          if [ -n "$prior" ]; then
            for index in $(seq 0 100); do
              mkdir -p "prior-$index"
              gh run download "$prior" -n "mutants-out-$index" -D "prior-$index" \
                >/dev/null 2>&1 || rm -rf "prior-$index"
            done
          fi
      - name: Download the current run's shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: mutants-out-*
      - name: Merge the shards' outcomes
        run: |
          python3 - "${{ needs.plan.outputs.files }}" <<'PYEOF'
          import json, os, sys
          files = json.loads(sys.argv[1])
          merged = {"outcomes": []}
          missing = []
          for index, path in enumerate(files):
              found = None
              for candidate in (f"merged/mutants-out-{index}/outcomes.json", f"prior-{index}/outcomes.json"):
                  if os.path.exists(candidate):
                      try:
                          json.load(open(candidate))
                      except (json.JSONDecodeError, OSError):
                          continue
                      found = candidate
                      break
              if found is None:
                  missing.append(path)
                  continue
              data = json.load(open(found))
              for outcome in data.get("outcomes") or []:
                  outcome["path"] = path
                  merged["outcomes"].append(outcome)
              for field in ("total_mutants", "caught", "missed", "unviable", "timeout"):
                  merged[field] = merged.get(field, 0) + (data.get(field) or 0)
          json.dump(merged, open("merged/outcomes.json", "w"))
          if missing:
              print(f"::warning::{len(missing)} of {len(files)} shards left no outcomes: {', '.join(missing)}")
          PYEOF
      - id: report
        run: |
          if [ ! -f merged/outcomes.json ]; then
            echo "::error::no shard produced outcomes — the sweep did not run"
            exit 1
          fi
          uv run .github/workflows/mutants_report.py report merged/outcomes.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            mutants-report.md >>"$GITHUB_OUTPUT"
      - id: rolling
        if: steps.report.outputs.missed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label mutation-testing --state open --limit 1 \
            --json number --jq '.[0].number // ""')
          echo "number=$number" >>"$GITHUB_OUTPUT"
      - if: steps.report.outputs.missed != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.rolling.outputs.number }}
          title: ${{ steps.report.outputs.title }}
          content-filepath: mutants-report.md
          labels: 'mutation-testing'

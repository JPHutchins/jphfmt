name: mutants

on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:

# Serializes runs: the rolling issue is found by a query, so two runs at once could both miss it
# and both create one. Queues rather than cancels.
concurrency: mutation-testing-report

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      prior: ${{ steps.list.outputs.prior }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The sharded set is src/ by decision: those are the crate's mutation targets. The old
          # unfiltered sweep ran over the same files cargo-mutants would mutate; tests/, benches/,
          # and build scripts are test runners, not mutation targets, and are out of scope.
          # One cell per src file: {file, index}.
          matrix=$(find src -name '*.rs' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | to_entries
              | map(.value as $f | {file: $f, index: (.key | tostring)})')
          jq -e 'length > 0' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          prior=$(gh run list --workflow mutants --limit 100 \
            --json databaseId,headSha,status,conclusion \
            --jq 'map(select(.headSha == "${{ github.sha }}" and .status == "completed")) | .[].databaseId' 2>/dev/null || true)
          { echo "prior<<EOF"; echo "$prior"; echo "EOF"; } >>"$GITHUB_OUTPUT"
          outside=$(find . -path ./target -prune -o -name '*.rs' -print | grep -v '^./src/' || true)
          if [ -n "$outside" ]; then
            echo "::warning::.rs files outside src/ are not sharded and are not mutated:"
            echo "$outside" | sed 's/^/  /' >&2
          fi

  # One shard per source file: a runner shutdown costs the shard it killed, not the whole sweep —
  # the 51-minute monolith that died in #136 becomes many minutes-long cells, each with its own
  # outcomes artifact. A shard whose outcomes already exist from a prior run of this SHA skips —
  # the resume: a re-dispatch after a shutdown re-runs only the shards that died. The check runs
  # before the toolchain installs, so a skipped shard pays nothing.
  shard:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          while read -r prior; do
            mkdir -p prior
            if gh run download "$prior" -n "mutants-out-${{ matrix.index }}" -D prior \
                >/dev/null 2>&1 \
              && jq -e 'type == "object"' prior/outcomes.json >/dev/null 2>&1 \
              && [ -f prior/complete ]; then
              echo "shard already analyzed in run $prior — skipping"
              skip=true
              break
            fi
            rm -rf prior
          done < <(echo "${{ needs.plan.outputs.prior }}")
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prior.outputs.skip != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.prior.outputs.skip != 'true'
        with:
          tool: cargo-mutants
      - id: sweep
        if: steps.prior.outputs.skip != 'true'
        continue-on-error: true
        env:
          FILE: ${{ matrix.file }}
        run: |
          rc=0
          cargo mutants --jobs 8 --file "$FILE" --output mutants.out || rc=$?
          # Exit 2 (missed mutants) is a completed sweep; 4 and 70 abort it. The marker is what
          # the skip gate and the upload check read, so an aborted sweep leaves no artifact.
          { [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; } && touch mutants.out/complete
      - if: steps.prior.outputs.skip != 'true' && hashFiles('mutants.out/complete') != ''
        uses: actions/upload-artifact@v7
        with:
          # A "Re-run all jobs" re-executes this shard in the same run, where artifact names are
          # immutable without this; same-SHA same-file outcomes are identical content either way.
          overwrite: true
          # The whole directory: outcomes.json plus each survivor's log and diff, which the
          # report's footer points readers at. The glob roots the contents at the artifact root,
          # so every downloader reads outcomes.json flat.
          name: mutants-out-${{ matrix.index }}
          path: mutants.out/*

  report:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Download the prior runs' shards, newest first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for idx in $(jq -r '.[].index' <<< '${{ needs.plan.outputs.matrix || '[]' }}' 2>/dev/null || true); do
            mkdir -p "prior-$idx"
            while read -r prior; do
              gh run download "$prior" -n "mutants-out-$idx" -D "prior-$idx" \
                >/dev/null 2>&1 \
                && jq -e 'type == "object"' "prior-$idx/outcomes.json" >/dev/null 2>&1 \
                && [ -f "prior-$idx/complete" ] && break
            done < <(echo "${{ needs.plan.outputs.prior }}")
            if ! jq -e 'type == "object"' "prior-$idx/outcomes.json" >/dev/null 2>&1; then
              rm -rf "prior-$idx"
            fi
          done
      - name: Download the current run's shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for idx in $(jq -r '.[].index' <<< '${{ needs.plan.outputs.matrix || '[]' }}' 2>/dev/null || true); do
            mkdir -p "merged/mutants-out-$idx"
            gh run download "$GITHUB_RUN_ID" -n "mutants-out-$idx" -D "merged/mutants-out-$idx" \
              >/dev/null 2>&1 \
              || gh run download "$GITHUB_RUN_ID" -n "mutants-out-$idx" -D "merged/mutants-out-$idx" \
                >/dev/null 2>&1 \
              || if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                  --jq '.[].name' 2>/dev/null | grep -qx "mutants-out-$idx"; then
                rm -rf "merged/mutants-out-$idx"
              fi
          done
      - id: merge
        name: Merge the shards' outcomes
        run: |
          uv run .github/workflows/mutants_report.py merge '${{ needs.plan.outputs.matrix || '[]' }}' \
            merged prior merged/outcomes.json merged/missing.txt merged/empty.txt >>"$GITHUB_OUTPUT"
      - id: report
        run: |
          if [ -f merged/empty.txt ]; then
            {
              echo "The mutation sweep ran no shard: every shard failed or left no outcomes."
              echo
              echo '```'
              cat merged/missing.txt
              echo '```'
              echo "A re-dispatch resumes the shards that died."
            } > mutants-report.md
            echo "missed=0" >>"$GITHUB_OUTPUT"
            echo "title=Mutation sweep: no shard produced outcomes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          uv run .github/workflows/mutants_report.py report merged/outcomes.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            mutants-report.md '${{ needs.plan.outputs.matrix || '[]' }}' >>"$GITHUB_OUTPUT"
          # A partial merge must never read as clean: the issue body names the shards that left
          # no outcomes, and the missed-count gate below cannot suppress an update on it.
          if [ -s merged/missing.txt ]; then
            {
              echo
              echo "**Shards with no outcomes** — a runner shutdown or a build failure took them;"
              echo "a re-dispatch resumes exactly these:"
              echo '```'
              cat merged/missing.txt
              echo '```'
            } >> mutants-report.md
          fi
      - id: rolling
        if: steps.report.outputs.missed != '0' || steps.merge.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label mutation-testing --state open --limit 1 \
            --json number --jq '.[0].number // ""')
          echo "number=$number" >>"$GITHUB_OUTPUT"
      - if: steps.report.outputs.missed != '0' || steps.merge.outputs.missing == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.rolling.outputs.number }}
          title: ${{ steps.report.outputs.title }}${{ steps.merge.outputs.missing == 'true' && ' (partial shards)' || '' }}
          content-filepath: mutants-report.md
          labels: 'mutation-testing'
      - name: Retire the rolling issue on a complete clean sweep
        if: steps.report.outputs.missed == '0' && steps.merge.outputs.missing != 'true' && steps.merge.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label mutation-testing --state open --limit 20 \
            --json number --jq '.[].number' | while read -r number; do
            gh issue close "$number" --reason completed
          done

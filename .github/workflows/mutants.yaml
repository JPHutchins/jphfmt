name: mutants

on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        id: cache
        with:
          path: mutants-report.txt
          key: mutants-${{ github.sha }}

      - if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Commit ${{ github.sha }} already analyzed — skipping."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'

      - uses: taiki-e/install-action@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-mutants

      # Unguarded: a sub-millisecond command with no side effects, and an output the issue title
      # reads. Gating it would make an empty title the failure mode if the guards ever diverged.
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      # `set -o pipefail` is what makes this step's outcome cargo-mutants' rather than `tee`'s. The
      # default shell is `bash -e {0}`, which has no pipefail, so the step passed on every run and
      # the issue below was never filed: 1234 mutants, 200 missed, reported as success.
      - id: mutants
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo mutants --jobs 8 2>&1 | tee mutants-report.txt

      - if: steps.cache.outputs.cache-hit != 'true' && steps.mutants.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Mutation testing: surviving mutants ${{ steps.sha.outputs.short }}'
          content-filepath: mutants-report.txt
          labels: 'mutation-testing'

name: mutants

on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:

# Serializes runs: the rolling issue is found by a query, so two runs at once could both miss it
# and both create one. Queues rather than cancels.
concurrency: mutation-testing-report

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          files=$(find src -name '*.rs' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >>"$GITHUB_OUTPUT"
          outside=$(find . -path ./target -prune -o -name '*.rs' -print | grep -v '^./src/' || true)
          if [ -n "$outside" ]; then
            echo "::warning::.rs files outside src/ are not sharded and are not mutated:"
            echo "$outside" | sed 's/^/  /' >&2
          fi

  # One shard per source file: a runner shutdown costs the shard it killed, not the whole sweep —
  # the 51-minute monolith that died in #136 becomes many minutes-long cells, each with its own
  # outcomes artifact. A shard whose outcomes already exist from a prior completed run of this
  # SHA skips — the resume: a re-dispatch after a shutdown re-runs only the shards that died.
  # The check runs before the toolchain installs, so a skipped shard pays nothing.
  shard:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v7
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow mutants --limit 100 \
            --json databaseId,headSha,status \
            --jq 'map(select(.headSha == "${{ github.sha }}" and .status == "completed")) | .[0].databaseId // ""' 2>/dev/null || true)
          skip=false
          if [ -n "$prior" ]; then
            mkdir -p prior
            if gh run download "$prior" -n "mutants-out-${{ strategy.job-index }}" -D prior \
                >/dev/null 2>&1 \
              && jq -e . prior/outcomes.json >/dev/null 2>&1; then
              echo "shard already analyzed in run $prior — skipping"
              skip=true
            fi
          fi
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prior.outputs.skip != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.prior.outputs.skip != 'true'
        with:
          tool: cargo-mutants
      - id: sweep
        if: steps.prior.outputs.skip != 'true'
        continue-on-error: true
        run: cargo mutants --file "${{ matrix.file }}" --output mutants.out
      - if: steps.prior.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          # A "Re-run all jobs" re-executes this shard in the same run, where artifact names are
          # immutable without this; same-SHA same-index outcomes are identical content either way.
          overwrite: true
          # The whole directory: outcomes.json plus each survivor's log and diff, which the
          # report's footer points readers at. upload-artifact stores the directory's files at
          # the artifact root, so every downloader extracts outcomes.json flat.
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out/

  report:
    needs: shard
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Download the prior runs' shards, newest first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bound=$(jq length <<< '${{ needs.plan.outputs.files || '[]' }}' 2>/dev/null || echo 0)
          for index in $(seq 0 $((bound - 1))); do
            mkdir -p "prior-$index"
            while read -r prior; do
              [ -z "$prior" ] && break
              gh run download "$prior" -n "mutants-out-$index" -D "prior-$index" \
                >/dev/null 2>&1 && jq -e . "prior-$index/outcomes.json" >/dev/null 2>&1 && break
            done < <(gh run list --workflow mutants --limit 100 \
              --json databaseId,headSha,status \
              --jq 'map(select(.headSha == "${{ github.sha }}" and .status == "completed")) | .[].databaseId' 2>/dev/null || true)
            if ! jq -e . "prior-$index/outcomes.json" >/dev/null 2>&1; then
              rm -rf "prior-$index"
            fi
          done
      - name: Download the current run's shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bound=$(jq length <<< '${{ needs.plan.outputs.files || '[]' }}' 2>/dev/null || echo 0)
          for index in $(seq 0 $((bound - 1))); do
            mkdir -p "merged/mutants-out-$index"
            gh run download "$GITHUB_RUN_ID" -n "mutants-out-$index" -D "merged/mutants-out-$index" \
              >/dev/null 2>&1 || rm -rf "merged/mutants-out-$index"
          done
      - id: merge
        name: Merge the shards' outcomes
        run: |
          python3 - '${{ needs.plan.outputs.files || '[]' }}' <<'PYEOF'
          import json, os, sys
          files = json.loads(sys.argv[1])
          merged: dict = {"outcomes": []}
          missing: list[str] = []
          for index, path in enumerate(files):
              found = None
              for candidate in (
                  f"merged/mutants-out-{index}/outcomes.json",
                  f"prior-{index}/outcomes.json",
              ):
                  if not os.path.exists(candidate):
                      continue
                  try:
                      data = json.load(open(candidate))
                  except (json.JSONDecodeError, OSError):
                      continue
                  if not isinstance(data, dict):
                      continue
                  found = (candidate, data)
                  break
              if found is None:
                  missing.append(path)
                  continue
              _, data = found
              for outcome in data.get("outcomes") or []:
                  if isinstance(outcome, dict):
                      merged["outcomes"].append(outcome)
              for field in ("total_mutants", "caught", "missed", "unviable", "timeout"):
                  value = data.get(field) or 0
                  if not isinstance(value, int):
                      value = 0
                  merged[field] = merged.get(field, 0) + value
          os.makedirs("merged", exist_ok=True)
          json.dump(merged, open("merged/outcomes.json", "w"))
          missing_text = "\n".join(missing)
          open("merged/missing.txt", "w").write(missing_text)
          empty = len(merged["outcomes"]) == 0
          if empty:
              open("merged/empty.txt", "w").write("no shard produced outcomes — the sweep did not run\n")
          if missing:
              print(f"::warning::{len(missing)} of {len(files)} shards left no outcomes: {missing_text}")
          print(f"missing={'true' if missing else 'false'}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          print(f"empty={'true' if empty else 'false'}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PYEOF
      - id: report
        run: |
          if [ -f merged/empty.txt ]; then
            {
              echo "The mutation sweep ran no shard: every shard failed or left no outcomes."
              echo
              echo '```'
              cat merged/missing.txt
              echo '```'
              echo "A re-dispatch resumes the shards that died."
            } > mutants-report.md
            echo "missed=0" >>"$GITHUB_OUTPUT"
            echo "title=Mutation sweep: no shard produced outcomes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          uv run .github/workflows/mutants_report.py report merged/outcomes.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            mutants-report.md >>"$GITHUB_OUTPUT"
          # A partial merge must never read as clean: the issue body names the shards that left
          # no outcomes, and the missed-count gate below cannot suppress an update on it.
          if [ -s merged/missing.txt ]; then
            {
              echo
              echo "**Shards with no outcomes** — a runner shutdown or a build failure took them;"
              echo "a re-dispatch resumes exactly these:"
              echo '```'
              cat merged/missing.txt
              echo '```'
            } >> mutants-report.md
          fi
      - id: rolling
        if: steps.report.outputs.missed != '0' || steps.merge.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label mutation-testing --state open --limit 1 \
            --json number --jq '.[0].number // ""')
          echo "number=$number" >>"$GITHUB_OUTPUT"
      - if: steps.report.outputs.missed != '0' || steps.merge.outputs.missing == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.rolling.outputs.number }}
          title: ${{ steps.report.outputs.title }}${{ steps.merge.outputs.missing == 'true' && ' (partial shards)' || '' }}
          content-filepath: mutants-report.md
          labels: 'mutation-testing'
      - name: Retire the rolling issue on a complete clean sweep
        if: steps.report.outputs.missed == '0' && steps.merge.outputs.missing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label mutation-testing --state open --limit 20 \
            --json number --jq '.[].number' | while read -r number; do
            gh issue close "$number" --reason completed
          done

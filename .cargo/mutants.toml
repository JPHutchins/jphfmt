# Mutation scoring runs the deterministic suite only. The proptest target
# (tests/properties.rs) is randomized, so including it makes the mutation score
# vary run to run; it still runs in the normal `test` gate as a fuzz harness.
additional_cargo_test_args = ["--lib", "--test", "conformance"]

# The sweep's excluded mutants, proven equivalent:
# - structure.rs:338:60: the chain branch's base_level division feeds only the refusal's own
#   shape_agrees comparison, which passes the same base_level to both renders, so the value
#   cancels and neither the % nor the * mutant can change any output.
# - structure.rs:113:64: the for header's re-read guard divides the same way — its base_level
#   feeds both sides of the header == re_read comparison, and the emit recomputes its own, so
#   the % and the * mutants cancel the same way (#174's review).
# - structure.rs:292:42: the contains_comment span's + with * gains only the bracket token,
#   and is_comment is token-kind-based, so a bracket can never trip the check.
# - tokens.rs:677:37: the newline early-return's == with != flips which spans skip the scan,
#   and the only spans whose skip status changes are newline-only interiors, where none of
#   the scan's refusal checks (star gaps, bit-field colons) can fire.
# - structure.rs:781:28 and 760:28: the stmt-expr guard's two render levels — a mutation of
#   either + breaks the statement == re_read equality and emits the other, unmutated side.
# The exclude-check gate (mutants_report.py) asserts each pattern matches exactly its
# recorded mutant names against the current source, so a drifted pattern fails loudly.
exclude_re = [
    'structure\.rs:338:60: replace / with [%*] in emit_tokens',
    'structure\.rs:292:42: replace \+ with \* in emit_tokens',
    'tokens\.rs:677:37: replace == with != in joined_pair_respaced',
    'structure\.rs:113:64: replace / with [%*] in emit_tokens',
    'structure\.rs:781:28: replace \+ with [*-] in format_stmt_expr',
    'structure\.rs:787:28: replace \+ with [*-] in format_stmt_expr',
]

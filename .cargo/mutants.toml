# Mutation scoring runs the deterministic suite only. The proptest target
# (tests/properties.rs) is randomized, so including it makes the mutation score
# vary run to run; it still runs in the normal `test` gate as a fuzz harness.
additional_cargo_test_args = ["--lib", "--test", "conformance"]

# The sweep's excluded mutants, proven equivalent:
# - structure.rs:311: the chain branch's base_level division feeds only the refusal's own
#   shape_agrees comparison, which passes the same base_level to both renders, so the value
#   cancels and neither the % nor the * mutant can change any output.
# - structure.rs:269:42: the contains_comment span's + with * gains only the bracket token,
#   and is_comment is token-kind-based, so a bracket can never trip the check.
# - tokens.rs:644:37: the newline early-return's == with != flips which spans skip the scan,
#   and the only spans whose skip status changes are newline-only interiors, where none of
#   the scan's refusal checks (star gaps, subscripts, call heads, bit-field colons) can fire.
# The exclude-check gate (mutants_report.py) asserts each pattern matches exactly its
# recorded mutant names against the current source, so a drifted pattern fails loudly.
exclude_re = [
    'structure\.rs:311:60: replace / with [%*] in emit_tokens',
    'structure\.rs:269:42: replace \+ with \* in emit_tokens',
    'tokens\.rs:644:37: replace == with != in joined_pair_respaced',
]
